<text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">One daily run moves SQL Server data to Streamlit, all inside AWS</text>
<text x="24" y="48" font-size="11.5" fill="#6b6a66">Bronze, Silver, Gold on S3 built by Glue PySpark; Athena serves the dashboards</text>
